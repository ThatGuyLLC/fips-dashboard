name: Daily Digest Email

on:
  schedule:
    - cron: '7 15 * * *'  # 15:07 UTC daily (7:07 AM PST / 8:07 AM PDT)
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look-back window in hours'
        required: false
        default: '24'

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build and send digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIPS_REPO_DIR: ${{ runner.temp }}/fips-src
          CORE_DEVS_REPO_DIR: ${{ runner.temp }}/core-devs-src
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MEETINGS_DB: ${{ vars.NOTION_MEETINGS_DB }}
          # Recipients and SMTP credentials live only in Actions secrets.
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_HOURS: ${{ github.event.inputs.hours || '24' }}
        run: python3 daily_digest.py
